<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Containers</title>
<style>
  body { font: 12px/1.4 -apple-system, sans-serif; background: var(--orca-background); color: var(--orca-foreground); margin: 0; padding: 10px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: var(--space-m) 0 0; color: var(--orca-muted-foreground); }
  .msg { color: var(--orca-muted-foreground); padding: 8px 0; }
  .err { color: #f85149; border: 1px solid var(--orca-border); border-radius: 4px; padding: 8px; background: var(--orca-card); }
  /* One spacing scale for every block: blocks are separated by a border with --space-l around it. */
  :root { --space-s: 6px; --space-m: 10px; --space-l: 14px; }
  .item { border-bottom: 1px solid var(--orca-border); padding: var(--space-m) 0 var(--space-l); }
  .name { font-weight: 600; word-break: break-all; }
  .running { color: #3fb950; } .exited { color: var(--orca-muted-foreground); }
  .sub { color: var(--orca-muted-foreground); font-size: 11px; word-break: break-all; }
  .row { display: flex; gap: 8px; margin-top: var(--space-m); flex-wrap: wrap; }
  button { font: inherit; background: var(--orca-secondary); color: var(--orca-secondary-foreground); border: 1px solid var(--orca-border); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:disabled, button[data-row][aria-disabled="true"] { opacity: .5; cursor: default; }
  pre { background: var(--orca-card); border: 1px solid var(--orca-border); padding: 8px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 4px 0; }
  /* Layout: VM and Compose are side-by-side cards (wrapping when narrow); containers are a list below. */
  .top { display: flex; flex-wrap: wrap; gap: var(--space-m); align-items: stretch; }
  .card { flex: 1 1 220px; min-width: 0; background: var(--orca-card, rgba(255, 255, 255, .03)); border: 1px solid var(--orca-border); border-radius: 8px; padding: 12px; }
  .card:empty { display: none; }
  .card-title, .section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--orca-muted-foreground); margin: 0 0 var(--space-s); }
  .section-title { margin: var(--space-l) 0 var(--space-s); display: flex; gap: 6px; }
  .section-title .count { font-weight: 400; }
  .group-title { font-size: 11px; color: var(--orca-muted-foreground); padding: var(--space-s) 12px; background: var(--orca-card, rgba(255, 255, 255, .03)); border-bottom: 1px solid var(--orca-border); }
  .list { border: 1px solid var(--orca-border); border-radius: 8px; overflow: hidden; }
  .list .item { padding: var(--space-m) 12px 12px; }
  .list .item:last-child { border-bottom: none; }
  .vm-line { font-weight: 600; margin-bottom: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--space-s); }
  .engine-counts { font-weight: 400; font-size: 11px; color: var(--orca-muted-foreground); }
  .engine-name { font-size: 15px; font-weight: 700; margin: 0 0 var(--space-s); word-break: break-all; }
  #vm-others:not(:empty) { border-top: 1px solid var(--orca-border); margin-top: var(--space-m); padding-top: var(--space-m); }
  .other-engine { display: flex; width: 100%; box-sizing: border-box; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px var(--space-s); margin-top: 4px; text-align: left; }
  .other-engine .other-name { min-width: 0; overflow-wrap: anywhere; }
  .other-engine .other-state { color: var(--orca-muted-foreground); font-size: 11px; min-width: 0; text-align: right; margin-left: auto; }
  .ports { display: flex; flex-wrap: wrap; gap: var(--space-s); margin-top: var(--space-s); }
  .port { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--orca-border); border-radius: 10px; padding: 1px 8px; background: var(--orca-card); }
  .port b { color: #58a6ff; font-weight: 600; }
  .port .arrow { color: var(--orca-muted-foreground); margin: 0 4px; }
  .port.link { cursor: pointer; }
  .port.link:hover { background: rgba(88, 166, 255, .14); border-color: #58a6ff; }
  .port.internal { color: var(--orca-muted-foreground); border-style: dashed; background: transparent; }
  .stopped { color: #f85149; } .starting { color: #d29922; }
  .spin { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--orca-border); border-top-color: currentColor; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .size { display: flex; gap: 16px; align-items: center; margin-top: var(--space-m); }
  .size label { display: flex; gap: 6px; align-items: center; color: var(--orca-muted-foreground); font-size: 11px; }
  .size select { font: inherit; background: var(--orca-card); color: var(--orca-foreground); border: 1px solid var(--orca-border); border-radius: 4px; padding: 3px 6px; }
  .stack + .stack { border-top: 1px solid var(--orca-border); margin-top: var(--space-m); padding-top: var(--space-m); }
  .stack .name { font-weight: 600; word-break: break-all; }
  .stack .files { word-break: break-all; }
  .stack-err { color: #f85149; font-size: 11px; margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
  button.danger { color: #f85149; }
  #status { color: var(--orca-muted-foreground); font-size: 11px; margin-top: var(--space-s); }
  #status:empty { display: none; }
  .stats { margin-top: var(--space-s); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--orca-muted-foreground); }
  .stats:empty { display: none; }
  .bar { height: 3px; border-radius: 2px; background: var(--orca-border); margin-top: 3px; width: 33%; min-width: 80px; max-width: 100%; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #58a6ff; }
  .bar.mem > i { background: #3fb950; }
  /* One log viewer per card (below its buttons) or per row of the All tree (below the row). */
  .logv { margin-top: var(--space-m); min-width: 0; }
  .logv [hidden] { display: none !important; }
  .logv-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-s); }
  .logv-head h2 { margin: 0; flex: 1 1 120px; min-width: 0; word-break: break-all; }
  .logv-note { color: #d29922; font-size: 11px; margin-top: 4px; }
  .logv-box { min-height: 120px; max-height: 40vh; box-sizing: border-box; } /* border-box: a chosen height equals offsetHeight */
  .logv-resize { display: flex; justify-content: center; align-items: center; height: 10px; cursor: ns-resize; touch-action: none; }
  .logv-resize::after { content: ''; width: 36px; height: 3px; border-radius: 2px; background: var(--orca-border); }
  .logv-resize:hover::after, .logv-resize:focus-visible::after { background: var(--orca-ring, #58a6ff); }
  /* Expanded viewer: it is laid over the panel where it is. Moving it would reset its scroll and focus, and
     hiding the rest with `visibility` keeps their scroll positions. */
  body.logs-max { overflow: hidden; }
  body.logs-max > .top, body.logs-max > #viewbar, body.logs-max > #content { visibility: hidden; }
  body.logs-max .logv.max { visibility: visible; position: fixed; inset: 0; z-index: 500; margin: 0; padding: 10px; box-sizing: border-box; background: var(--orca-background); display: flex; flex-direction: column; }
  body.logs-max .logv.max .logv-box { flex: 1; min-height: 0; max-height: none; }
  body.logs-max .logv.max .logv-resize { display: none; }
  body.logs-max > #status:not(:empty) { position: fixed; left: 10px; right: 10px; bottom: 6px; z-index: 600; background: var(--orca-card, var(--orca-background)); padding: 4px 8px; }
  .ln { min-height: 1.3em; }
  .ln .ts { color: var(--orca-muted-foreground); opacity: .6; margin-right: 8px; user-select: none; }
  .logv-older { text-align: center; margin-bottom: 4px; color: var(--orca-muted-foreground); font-size: 11px; }
  .logv-older.none { display: none; }
  .logv-state { color: var(--orca-muted-foreground); font-size: 11px; white-space: nowrap; }
  .logv-state .live { color: #3fb950; }
  .logv-search { display: flex; align-items: center; gap: var(--space-s); flex-wrap: wrap; margin-top: var(--space-s); }
  .logv-q { flex: 1 1 140px; min-width: 0; font: inherit; background: var(--orca-card); color: var(--orca-foreground); border: 1px solid var(--orca-border); border-radius: 4px; padding: 3px 6px; }
  button[aria-pressed] { min-width: 28px; }
  button[aria-pressed="true"], button.on, button[data-a="logs"][aria-expanded="true"], button[data-row="logs"][aria-expanded="true"] { background: rgba(88, 166, 255, .28); border-color: #58a6ff; color: var(--orca-foreground); font-weight: 700; box-shadow: inset 0 0 0 1px #58a6ff; }
  .logv-count { color: var(--orca-muted-foreground); font-size: 11px; }
  mark { background: rgba(210, 153, 34, .35); color: inherit; border-radius: 2px; }
  .hit { cursor: pointer; }
  .hit:hover { background: rgba(127, 127, 127, .12); }
  .hit.cur { background: rgba(88, 166, 255, .14); box-shadow: inset 2px 0 0 #58a6ff; }
  .hit.cur mark { background: rgba(210, 153, 34, .75); }
  .ln.focus { background: rgba(88, 166, 255, .18); box-shadow: inset 2px 0 0 #58a6ff; }
  .logv-context-bar { margin-bottom: 4px; }
  .logv-results .msg { padding: 4px 0; }
  /* View switch, pinned header and the "All" overview tree. */
  #viewbar { display: flex; align-items: center; gap: var(--space-m); flex-wrap: wrap; margin: var(--space-l) 0 var(--space-s); }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .pinned-name { font-weight: 600; word-break: break-all; }
  .tree { border: 1px solid var(--orca-border); border-radius: 8px; overflow: hidden; }
  .tree > :last-child .tg-head, .tree > :last-child .crow, .tree > :last-child > .logv { border-bottom: none; }
  .tg-head { display: flex; align-items: baseline; gap: 6px; padding: var(--space-s) 12px var(--space-s) calc(12px + var(--d, 0) * 14px); background: var(--orca-card, rgba(255, 255, 255, .03)); border-bottom: 1px solid var(--orca-border); cursor: pointer; }
  .tg-head .tg-name { font-weight: 600; word-break: break-all; }
  .tg-head.flagged { flex-wrap: wrap; }
  .tg-flags { display: inline-flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .tg-head .count { margin-left: auto; padding-left: 8px; color: var(--orca-muted-foreground); font-size: 11px; white-space: nowrap; }
  .chev { display: inline-block; width: 12px; color: var(--orca-muted-foreground); flex: none; }
  .openable:hover { background: rgba(127, 127, 127, .12); }
  .crow { padding: var(--space-s) 12px var(--space-s) calc(12px + var(--d, 0) * 14px + 18px); border-bottom: 1px solid var(--orca-border); }
  .crow.openable { cursor: pointer; }
  .crow-main { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .crow .st { flex: none; width: 12px; display: inline-flex; align-items: center; justify-content: center; }
  /* Drawn box instead of the ■ glyph, which renders much smaller than ▷ at this font size. */
  .st .sq { display: block; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
  .st.running { color: #3fb950; } .st.stopped { color: #f85149; opacity: .6; } .st.other { color: #d29922; }
  .flag { display: inline-block; font-size: 10px; font-weight: 600; line-height: 1.4; white-space: nowrap; border: 1px solid currentColor; border-radius: 10px; padding: 0 6px; }
  .flag.bad { color: #f85149; } .flag.warn { color: #d29922; }
  .flag.quiet { color: var(--orca-muted-foreground); font-weight: 400; border-color: var(--orca-border); }
  .crow .img { font-size: 11px; color: var(--orca-muted-foreground); word-break: break-all; }
  .crow .ports { margin-top: 4px; }
  .crow-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 4px var(--space-s); }
  .crow-foot .sub { flex: 1 1 100px; min-width: 0; }
  .crow-acts { display: inline-flex; gap: 4px; margin-left: auto; }
  .crow-acts button { padding: 0 8px; font-size: 11px; }
  /* A viewer uses the full width of the tree: indenting it would waste a narrow sidebar. */
  .titem:has(> .logv) .crow { border-bottom: none; }
  .titem > .logv { margin: 0; padding: var(--space-m) 12px var(--space-m); border-bottom: 1px solid var(--orca-border); }
  .crow-main .more, .tg-head .more { margin-left: 4px; padding: 0 6px; border-color: transparent; background: transparent; line-height: 1.2; opacity: 0; flex: none; }
  .tg-head .count + .more { margin-left: 0; }
  .crow-main .more { margin-left: auto; }
  .tg-head:hover .more, .tg-head:focus-within .more, .crow:hover .more, .crow:focus-within .more, .more:focus-visible, .more[aria-expanded="true"] { opacity: 1; }
  .op { color: #d29922; font-size: 11px; white-space: nowrap; margin-left: auto; }
  .op + .count { margin-left: 0; }
  #ctx-menu { position: fixed; z-index: 1000; min-width: 170px; max-width: calc(100vw - 8px); max-height: calc(100vh - 8px); overflow: auto; box-sizing: border-box; padding: 4px; background: var(--orca-popover, var(--orca-background)); color: var(--orca-foreground); border: 1px solid var(--orca-border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
  #ctx-menu [role="menuitem"] { display: block; width: 100%; text-align: left; background: transparent; border: none; border-radius: 4px; padding: 5px 10px; color: inherit; cursor: pointer; }
  #ctx-menu [role="menuitem"]:hover, #ctx-menu [role="menuitem"]:focus { background: rgba(127, 127, 127, .2); outline: none; }
  #ctx-menu [role="menuitem"]:focus-visible { box-shadow: inset 0 0 0 1px #58a6ff; }
  #ctx-menu [role="menuitem"][aria-disabled="true"] { opacity: .45; cursor: default; }
  #ctx-menu [role="menuitem"][aria-disabled="true"]:hover { background: transparent; }
  #ctx-menu [role="menuitem"].danger { color: #f85149; }
  #ctx-menu [role="separator"] { height: 1px; margin: 4px 2px; background: var(--orca-border); }
  @keyframes flash { from { background: rgba(88, 166, 255, .35); } to { background: transparent; } }
  .item.flash { animation: flash 1.8s ease-out; }
</style>
</head>
<body>
<div class="top">
  <div id="vm" class="card" tabindex="-1" hidden><div id="vm-main"></div><div id="vm-others"></div></div>
  <div id="compose" class="card"></div>
</div>
<div id="status"></div>
<div id="viewbar"></div>
<div id="content"><div class="msg">Loading...</div></div>
<script>
  const POLL_MS = 3000
  let state = null
  let busy = false
  const viewers = new Map() // container id -> log viewer, oldest first
  const MAX_VIEWERS = 3 // same limit as the worker's
  const NOTE_MS = 4000
  const REVEAL_MS = 1500 // a first chunk later than this does not move the page
  let logsEngine = null // engine the viewers were opened on
  let shownWorktree = null // worktree path of the last state shown
  let listUi = null // the detail view's persistent nodes: cards are updated in place, never rebuilt
  let treeUi = null // the same for the All tree: one node per group header and container row
  const LOGS_MAX_LINES = 20000
  const SEARCH_DEBOUNCE_MS = 300
  const LOGS_HEIGHT_MIN = 120 // same limits as the worker's
  const LOGS_HEIGHT_MAX = 4000
  const LOGS_HEIGHT_STEP = 40
  const LOGS_HEIGHT_SAVE_MS = 400 // key repeat must not flood the plugin bridge
  let expandedViewer = null // the viewer filling the panel
  let pageScroll = 0
  let logsHeight = null // chosen height in px, shared by every viewer; null: automatic
  let logsHeightChosen = false // changed here: a late saved value must not override it
  let logsHeightTimer = null
  let logsDrag = null // { viewer, y, height } at the start of a drag
  const STATS_MS = 5000
  let stats = {} // container id -> latest stats from the worker
  let statsKey = null // workspace context the stats belong to
  let statsBusy = false
  let statsTimer = null
  let timer = null
  let vm = null
  let engineCounts = null // containers of the whole selected engine, from the last listing
  let view = 'worktree' // 'worktree' (follows the focused workspace) or 'all' (overview tree); remembered by the worker
  let pinned = null // { scope, name, sub, focusId, focusDone }: detail view opened from the overview
  let overview = null // latest colima.overview result
  let modeSeq = 0 // bumped on every view / pin change: stale async results are dropped
  const collapsed = new Set() // group keys collapsed in the tree (panel memory only)
  const SCOPED = new Set(['colima.state', 'colima.stats', 'colima.compose', 'colima.logs.follow', 'colima.logs.older', 'colima.logs.search', 'colima.logs.context', 'colima.logs.terminal', 'colima.action', 'colima.shell'])
  let followSeq = 0 // ordering token for logs.follow / search / stop, so a late follow or search cannot outlive a stop
  const overviewMode = () => view === 'all' && !pinned
  const followsWorkspace = () => view === 'worktree' && !pinned
  let engineName = null // Docker context the panel is showing; null until the first answer
  let switching = false // an engine change is in flight: polling waits
  let switchSeq = 0 // only the newest engine pick counts
  let engineList = [] // engines of the last status answer, the selected one included: the way out without a status
  let engineProblem = null // why the engine status could not be read
  let vmAsked = 0 // status requests sent
  let vmShown = 0 // newest status request whose outcome is on screen
  const OTHERS_MS = 10000 // the worker caches the probes for 30s; asking is cheap
  let others = null // latest colima.others result: counts for the rows listed by colima.vm
  let othersSeq = 0 // only the newest answer counts
  let othersHtml = '' // markup on screen: unchanged rows are not rebuilt, so focus stays
  let othersTimer = null
  let refocusRow = null // after a switch made from a row: the engine just left, whose row takes the focus
  let vmError = null // { title, text } of the last failed VM operation
  let vmConfirm = null // 'stop' | 'restart' while that VM button waits for confirmation
  let vmConfirmTimer = null
  let size = null // { cpu, memory } chosen in the panel; seeded from saved prefs
  const CONTEXT_CHECK_MS = 700
  let shownKey = null // workspace context of the state, or of the failure, on screen
  let searching = true // no result yet for the focused workspace
  let ctxTimer = null
  let eventsLive = false // workspace.changed has been received: the polling watcher is not needed
  const OP_LABELS = { up: 'Starting…', down: 'Stopping…', restart: 'Restarting…', start: 'Starting…', stop: 'Stopping…' }
  const GROUP_OP_LABELS = { up: 'Bringing up…', start: 'Starting…', stop: 'Stopping…', restart: 'Restarting…', down: 'Taking down…' }
  const ROW_OP_LABELS = { start: 'Starting…', stop: 'Stopping…', restart: 'Restarting…', shell: 'Opening shell…' }
  const OP_STALE_MS = 15 * 60 * 1000 // a done event that never arrived must not leave a spinner forever
  const groupOps = new Map() // group ctx key -> { action, name, label, pending:Set, errors:[], at }
  const rowOps = new Map() // container id -> { label, at }
  const VM_OP_LABELS = { starting: 'Starting&hellip;', stopping: 'Stopping&hellip;', restarting: 'Restarting&hellip;' }
  const CONFIRM_MS = 4000
  const ARM_GUARD_MS = 400 // a confirm cannot fire right after being armed (key repeat, double click)
  let confirmAt = 0
  let vmConfirmAt = 0
  let confirmId = null // stack whose Down button is waiting for confirmation
  let confirmTimer = null
  const composeErrors = {} // stack id -> last failure message
  const GB = 1024 ** 3

  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

  async function request(name, input) {
    // A pinned scope rides along on every container-level request; the worker re-validates it.
    if (pinned && SCOPED.has(name)) input = { ...input, scope: pinned.scope }
    if (['colima.logs.follow', 'colima.logs.search', 'colima.logs.stop'].includes(name)) input = { ...input, token: ++followSeq }
    const res = await window.orca.host.call('plugin.request', { name, input, timeoutMs: 30000 })
    const out = res.output
    // Answers are tagged with the engine they were produced for; one for another engine than the selected one is dropped.
    if (out && out.engineName !== undefined && engineName !== null && out.engineName !== engineName) {
      return { stale: true, ok: false, cancelled: true, message: '', error: null }
    }
    return out
  }

  let statusTimer = null
  function setStatus(text, ttlMs) {
    clearTimeout(statusTimer)
    $('status').textContent = text || ''
    if (text && ttlMs) statusTimer = setTimeout(() => { if ($('status').textContent === text) $('status').textContent = '' }, ttlMs)
  }

  // Copies text. The panel runs in a sandboxed frame, so the async Clipboard API may be refused:
  // fall back to execCommand, and as a last resort leave the text selected in the status line.
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text)
      return true
    } catch { /* not allowed in this frame: try the legacy path */ }
    const ta = document.createElement('textarea')
    ta.value = text
    ta.setAttribute('readonly', '')
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none'
    document.body.appendChild(ta)
    ta.select()
    let ok = false
    try { ok = document.execCommand('copy') } catch { ok = false }
    ta.remove()
    return ok
  }

  async function copyPort(text) {
    if (await copyText(text)) { setStatus(`Copied ${text}`, 2000); return }
    setStatus(`Could not copy automatically. Select and copy: ${text}`)
    const range = document.createRange()
    range.selectNodeContents($('status'))
    const sel = window.getSelection()
    sel.removeAllRanges()
    sel.addRange(range)
  }

  const gb = (b) => `${Math.round(b / GB)} GB`
  const fmtBytes = (b) => (b >= GB ? `${(b / GB).toFixed(1)} GB` : `${Math.round(b / 1024 ** 2)} MB`)
  const clampPct = (n) => Math.max(0, Math.min(100, Number(n) || 0))

  // Compact usage block for a running container; empty until the first stats arrive.
  function statsHtml(id) {
    const st = stats[id]
    if (!st) return ''
    return `<div>CPU ${esc(st.cpuPercent.toFixed(1))}% &middot; MEM ${esc(fmtBytes(st.memUsage))} / ${esc(fmtBytes(st.memLimit))}</div>
      <div class="bar" title="CPU"><i style="width:${clampPct(st.cpuPercent)}%"></i></div>
      <div class="bar mem" title="Memory"><i style="width:${clampPct(st.memPercent)}%"></i></div>`
  }

  // Updates only the stats blocks in place, so rows (buttons, focus, confirm state) are untouched.
  function applyStats() {
    for (const el of document.querySelectorAll('.stats[data-id]')) el.innerHTML = statsHtml(el.dataset.id)
  }

  async function pollStats() {
    if (statsBusy || overviewMode() || searching || !state || state.error || !state.worktree) return
    if (!state.containers.some((c) => c.state === 'running')) { stats = {}; statsKey = shownKey; applyStats(); return }
    statsBusy = true
    const key = shownKey
    try {
      const r = await request('colima.stats', {})
      if (key !== shownKey || searching) return // workspace changed meanwhile: stale
      if (r.ok) { stats = r.stats || {}; statsKey = key; applyStats() }
    } catch { /* stats are best-effort; the next tick retries */ }
    finally { statsBusy = false }
  }

  const MEM_STEPS = [1, 2, 4, 6, 8, 12, 16, 20, 24, 32, 48, 64, 96, 128, 192, 256]
  const cpuChoices = (max) => Array.from({ length: max }, (_, i) => i + 1)
  // Common sizes up to the host limit, plus the saved value if it is not one of them.
  const memChoices = (max, current) =>
    [...new Set([...MEM_STEPS.filter((n) => n <= max), current])].filter((n) => n >= 1 && n <= max).sort((a, b) => a - b)
  // Docker's Ports column, e.g. "0.0.0.0:5432->5432/tcp, :::5432->5432/tcp, 6379/tcp".
  // Returns published (host -> container) and internal-only ports, deduping IPv4/IPv6 twins.
  function parsePorts(text) {
    const published = new Map()
    const internal = new Set()
    for (const part of String(text || '').split(',').map((s) => s.trim()).filter(Boolean)) {
      const m = part.match(/^(?:(.*):)?(\d+(?:-\d+)?)->(\d+(?:-\d+)?)\/(\w+)$/)
      if (m) {
        const host = !m[1] || m[1] === '0.0.0.0' || m[1] === '::' || m[1] === '[::]' ? 'localhost' : m[1]
        published.set(`${host}:${m[2]}>${m[3]}/${m[4]}`, { host, hostPort: m[2], port: m[3], proto: m[4] })
      } else internal.add(part)
    }
    const exposed = new Set([...published.values()].map((p) => `${p.port}/${p.proto}`))
    return { published: [...published.values()], internal: [...internal].filter((p) => !exposed.has(p)) }
  }

  // Address a published port is reachable at from the host; null for UDP and port ranges.
  // Bracketed IPv6 stays as-is, a bare IPv6 gets brackets.
  function portTarget(p) {
    if (p.proto !== 'tcp' || !/^\d{1,5}$/.test(p.hostPort)) return null
    const host = /^[\w.\-]+$|^\[[0-9a-fA-F:.]+\]$/.test(p.host) ? p.host : /^[0-9a-fA-F:.]+$/.test(p.host) ? `[${p.host}]` : null
    return host ? { url: `http://${host}:${p.hostPort}`, text: `${host}:${p.hostPort}` } : null
  }

  function renderPorts(text) {
    const { published, internal } = parsePorts(text)
    if (!published.length && !internal.length) return ''
    const pub = published.map((p) => {
      const t = portTarget(p)
      const label = `<b>${esc(p.host === 'localhost' ? '' : p.host + ':')}${esc(p.hostPort)}</b><span class="arrow">→</span>${esc(p.port)}${p.proto === 'tcp' ? '' : '/' + esc(p.proto)}`
      if (!t) return `<span class="port">${label}</span>`
      return `<span class="port link" role="button" tabindex="0" data-copy="${esc(t.text)}" aria-label="Copy ${esc(t.text)}">${label}</span>`
    }).join('')
    const int = internal.map((p) => `<span class="port internal">${esc(p.replace('/tcp', ''))}</span>`).join('')
    return `<div class="ports">${pub}${int}</div>`
  }

  const options = (values, selected, unit = '') =>
    values.map((n) => `<option value="${n}"${n === selected ? ' selected' : ''}>${n}${unit}</option>`).join('')

  const startLabel = () => `Start ${vm.engine.label}${vm.controls.size && size ? ` (${size.cpu} CPU, ${size.memory} GB)` : ''}`

  const engineText = (e) => `${e.label}${e.label.includes(e.name) ? '' : ` · ${e.name}`}`

  // A non-breaking space keeps each number with its word when the sidebar is narrow.
  const countsText = (c) => `${c.running}\u00a0running · ${c.stopped}\u00a0stopped`
  // "engine stopped", so that an engine that is off never reads like a count of stopped containers.
  const rowText = (st) => (!st ? 'checking…' : st.state === 'running' ? countsText(st) : st.state === 'stopped' ? 'engine stopped' : st.state)

  // The engine switcher below the engine buttons: rows come with colima.vm, counts are filled in from
  // colima.others. Rendered apart from the card so polls do not rebuild it.
  function renderOthers() {
    const el = $('vm-others')
    const current = vm && vm.engine ? vm.engine.name : engineName
    // Counts asked for while another engine was selected say nothing about this one.
    const counts = new Map((others && (current === null || others.engineName === current) ? others.engines || [] : []).map((e) => [e.name, e]))
    // Without a status: the engines last listed, or else the ones colima.others could probe.
    const known = engineList.length ? engineList : [...counts.keys()].map((name) => ({ name, label: name, state: null }))
    const list = vm && vm.engine ? vm.engines || [] : known.filter((e) => e.name !== current)
    const rows = list.map((e) => {
      const st = e.state ? e : counts.get(e.name)
      const text = rowText(st)
      return `<button type="button" class="other-engine" data-a="engine" data-t="${esc(e.name)}" title="Switch to this engine"><span class="other-name">${esc(engineText(e))}</span><span class="other-state">${esc(text)}</span></button>`
    }).join('')
    const html = rows ? `<div class="card-title">Switch engine</div>${rows}` : ''
    const buttons = () => Array.from(el.querySelectorAll('button'))
    // The row called `name`, else the one now at `index`, else the card itself: focus never falls to the body.
    const focusRow = (name, index) => {
      const list = buttons()
      const target = list.find((b) => b.dataset.t === name) || list[Math.min(index, list.length - 1)] || $('vm')
      target.focus({ preventScroll: true })
    }
    if (html !== othersHtml) {
      const index = buttons().indexOf(document.activeElement)
      const name = index < 0 ? null : document.activeElement.dataset.t
      othersHtml = html
      el.innerHTML = html
      if (index >= 0) focusRow(name, index)
    }
    if (refocusRow !== null && (vm || buttons().some((b) => b.dataset.t === refocusRow))) {
      if (document.activeElement === document.body || el.contains(document.activeElement)) focusRow(refocusRow, 0)
      refocusRow = null
    }
  }

  async function pollOthers() {
    if (switching) return
    const seq = ++othersSeq
    try {
      const r = await request('colima.others', {})
      if (seq !== othersSeq || r.stale) return
      others = r
      renderOthers()
    } catch { /* best-effort; the next tick retries */ }
  }

  // The card while there is no status to show: switching, still asking, or the request failed.
  function engineUnknownHtml() {
    const known = engineList.find((e) => e.name === engineName)
    const name = known ? known.label : engineName
    const waiting = (text) => `<div class="vm-line"><span><span class="spin"></span> ${text}</span></div>`
    const status = switching ? waiting('Switching&hellip;')
      : engineProblem ? `<div class="err">Could not read the engine status: <span class="sub">${esc(engineProblem)}</span></div>`
        : waiting('Checking&hellip;')
    return `<div class="card-title">Engine</div>${name ? `<div class="engine-name">${esc(name)}</div>` : ''}${status}`
  }

  // The card is never hidden: its switch list is the way out of an engine that fails or hangs.
  function renderVm() {
    const el = $('vm-main')
    $('vm').hidden = false
    renderOthers()
    if (!vm) { el.innerHTML = engineUnknownHtml(); return }
    if (!size) size = { ...vm.prefs }
    // Polling must not rebuild the CPU/RAM selectors while the user has one open.
    if (el.contains(document.activeElement) && document.activeElement.tagName === 'SELECT') return
    const ctl = vm.controls
    const dockerDown = Boolean(state && state.error)
    let cls = vm.running ? 'running' : 'stopped'
    let label = vm.running ? 'running' : 'stopped'
    const vmBusy = vm.op || (vm.starting ? 'starting' : null)
    if (vmBusy) { cls = 'starting'; label = vmBusy }
    const bits = vm.running
      ? [vm.cpu ? `${vm.cpu} CPU` : '', vm.memory ? `${gb(vm.memory)} RAM` : '', vm.disk ? `${gb(vm.disk)} disk` : '', vm.runtime, vm.arch, vm.version ? `Docker ${vm.version}` : ''].filter(Boolean)
      : []
    const counts = vm.running && !vmBusy && engineCounts ? `<span class="engine-counts" title="Containers on this engine">${esc(countsText(engineCounts))}</span>` : ''
    const specs = bits.length ? `<div class="sub">${bits.map(esc).join(' &middot; ')}</div>` : ''
    const missing = vm.installed === false ? `<div class="sub">${esc(ctl.missing || 'Engine tools not found.')}</div>` : ''
    const canStart = vm.installed !== false && ctl.start && (!vm.running || dockerDown)
    const confirming = vmConfirm
    const vmButtons = vm.running && vm.installed !== false && (ctl.restart || ctl.stop)
      ? `<div class="row">${ctl.restart ? `<button data-a="vm-op" data-c="restart">${confirming === 'restart' ? 'Confirm restart?' : 'Restart'}</button>` : ''}${ctl.stop ? `<button class="danger" data-a="vm-op" data-c="stop">${confirming === 'stop' ? 'Confirm stop?' : 'Stop'}</button>` : ''}</div>`
      : ''
    const sizeSel = ctl.size ? `<div class="size">
          <label>CPU <select id="size-cpu">${options(cpuChoices(vm.limits.maxCpu), size.cpu)}</select></label>
          <label>RAM <select id="size-mem">${options(memChoices(vm.limits.maxMemory, size.memory), size.memory, ' GB')}</select></label>
        </div>` : ''
    const btn = vmBusy
      ? `<div class="row"><button disabled><span class="spin"></span> ${VM_OP_LABELS[vmBusy]}</button></div>`
      : (canStart ? `${sizeSel}<div class="row"><button data-a="vm-start">${esc(startLabel())}</button></div>` : '') + vmButtons
    const gone = vm.engine.missing ? `<div class="err" style="margin-top:6px">The engine context <b>${esc(vm.engine.name)}</b> no longer exists. Select another engine to continue.</div>` : ''
    const err = gone + (vmError ? `<div class="err" style="margin-top:6px">${esc(vmError.title)} failed: <span class="sub">${esc(vmError.text)}</span></div>` : '')
    el.innerHTML = `<div class="card-title">Engine</div><div class="engine-name">${esc(vm.engine.label)}</div><div class="vm-line"><span><span class="${cls}">&#9679;</span> ${label[0].toUpperCase() + label.slice(1)}</span>${counts}</div>${specs}${missing}${btn}${err}`
  }

  // Compose errors and the Down confirmation are per scope root + stack id, so they never leak across scopes.
  const stackKey = (id, root = state && state.worktree) => `${root}\0${id}`

  function renderStack(s) {
    const title = s.project || s.files[0] || s.id
    const files = s.files.length ? `<div class="sub files">${esc(s.files.join(', '))}</div>` : ''
    const count = `<div class="sub">${esc(s.running)}/${esc(s.total)} running</div>`
    const bits = s.op
      ? `<div class="sub"><span class="spin"></span> ${esc(OP_LABELS[s.op] || 'Working…')}</div>`
      : ''
    const off = s.op ? ' disabled' : ''
    const confirming = confirmId === stackKey(s.id)
    const buttons = [
      s.canUp ? `<button data-a="compose" data-t="${esc(s.id)}" data-c="up"${off}>Up</button>` : '',
      s.total > 0 ? `<button data-a="compose" data-t="${esc(s.id)}" data-c="restart"${off}>Restart</button>` : '',
      s.total > 0 ? `<button class="danger" data-a="compose" data-t="${esc(s.id)}" data-c="down"${off}>${confirming ? 'Confirm down?' : 'Down'}</button>` : ''
    ].join('')
    const err = composeErrors[stackKey(s.id)] ? `<div class="stack-err">${esc(composeErrors[stackKey(s.id)])}</div>` : ''
    return `<div class="stack"><div class="name">${esc(title)}</div>${files}${count}${bits}<div class="row">${buttons}</div>${err}</div>`
  }

  // Fills the Compose card next to the VM card; empty (and hidden) when there is nothing to show.
  function renderCompose() {
    const ok = !overviewMode() && !searching && state && !state.error && state.worktree
    const stacks = ok ? state.stacks || [] : []
    $('compose').innerHTML = stacks.length ? `<div class="card-title">Compose</div>${stacks.map(renderStack).join('')}` : ''
  }

  const MARKERS = {
    unhealthy: { cls: 'bad', text: 'unhealthy', title: 'The healthcheck is failing' },
    restarting: { cls: 'warn', text: 'restarting', title: 'The engine is restarting this container' },
    starting: { cls: 'quiet', text: 'health: starting', title: 'The healthcheck has not passed yet' }
  }
  function markerHtml(marker) {
    if (!marker) return ''
    const m = marker.kind === 'exit'
      // 137 is quiet: stopping the engine, or a container that ignores SIGTERM, ends this way too.
      ? { cls: marker.code === 137 ? 'quiet' : 'bad', text: `exit ${marker.code}`, title: marker.code === 137
          ? 'Exit code 137 usually means SIGKILL: a forced stop, or possibly running out of memory.'
          : `Stopped with exit code ${marker.code}` }
      : MARKERS[marker.kind]
    return m ? `<span class="flag ${m.cls}" title="${esc(m.title)}">${esc(m.text)}</span>` : ''
  }

  // The card's own markup; its log viewer is a sibling node that is never rebuilt. Usage is filled in by applyStats.
  function renderContainer(c) {
    return `<div class="name"><span class="${esc(c.state)}">&#9679;</span> ${esc(c.name)} ${markerHtml(c.marker)}</div>
        <div class="sub">${esc(c.status)}</div>
        ${renderPorts(c.ports)}
        ${c.state === 'running' ? `<div class="stats" data-id="${esc(c.id)}"></div>` : ''}
        <div class="row">
          <button data-a="logs" data-t="${esc(c.id)}">logs</button>
          <button data-a="${c.state === 'running' ? 'stop' : 'start'}" data-t="${esc(c.id)}">${c.state === 'running' ? 'stop' : 'start'}</button>
          <button data-a="shell" data-t="${esc(c.id)}">shell</button>
        </div>`
  }

  // DOM element with properties, `data` entries, `attrs` and children.
  function h(tag, props = {}, ...children) {
    const el = document.createElement(tag)
    const { data, attrs, ...rest } = props
    Object.assign(el, rest)
    if (data) Object.assign(el.dataset, data)
    for (const [name, value] of Object.entries(attrs || {})) el.setAttribute(name, value)
    el.append(...children)
    return el
  }

  // Rewrites only what changed, so focus and nodes survive a poll.
  function setHtml(el, html) {
    if (el.renderedHtml === html) return
    el.renderedHtml = html
    el.innerHTML = html
  }

  // What holds a container's viewer: its card in the detail view, or its row in the All tree. A row without a
  // scope has no actions, so it holds none. Nor does one that a message has replaced on screen.
  function cardOf(id) {
    const ui = overviewMode() ? treeUi : listUi
    if (!ui || ui.title.parentNode !== $('content')) return null
    if (!overviewMode()) return ui.cards.get(id) || null
    const row = ui.nodes.get(`r:${id}`)
    return row && row.scope ? row : null
  }

  function logButtonOf(id) {
    const card = cardOf(id)
    return card ? card.body.querySelector(overviewMode() ? 'button[data-row="logs"]' : 'button[data-a="logs"]') : null
  }

  function markLogButton(id) {
    const button = logButtonOf(id)
    if (button) button.setAttribute('aria-expanded', String(viewers.has(id)))
  }

  function updateCard(c) {
    let card = listUi.cards.get(c.id)
    if (!card) {
      const body = h('div', { className: 'item-body' })
      card = { body, el: h('div', { className: 'item', data: { cid: c.id } }, body) }
      listUi.cards.set(c.id, card)
    }
    const html = renderContainer(c)
    if (card.body.renderedHtml !== html) {
      const active = document.activeElement
      const held = active && card.body.contains(active) ? ['a', 'copy'].find((k) => active.dataset[k] !== undefined) : undefined
      const value = held && active.dataset[held]
      setHtml(card.body, html)
      const next = held && Array.from(card.body.querySelectorAll(`[data-${held}]`)).find((x) => x.dataset[held] === value)
      if (next) next.focus({ preventScroll: true })
      markLogButton(c.id)
    }
    card.name = c.name
    const v = viewers.get(c.id)
    if (v && v.name !== c.name) setViewerName(v, c.name)
    return card.el
  }

  // A browser resets the scroll and focus of whatever is moved: put them back.
  function keepingViewState(v, move) {
    const box = v.els.box
    const follow = logAtBottom(box)
    const top = box.scrollTop
    const active = document.activeElement
    const held = v.el.contains(active)
    const caret = held ? [active.selectionStart, active.selectionEnd] : null
    move()
    box.scrollTop = follow ? box.scrollHeight : top
    if (!held) return
    active.focus({ preventScroll: true })
    if (active.setSelectionRange && typeof caret[0] === 'number') active.setSelectionRange(...caret)
  }

  // Puts `wanted` in order inside `parent`, moving the other nodes around the cards that hold a viewer.
  function placeInOrder(parent, wanted) {
    const holds = (node) => viewers.has(node.dataset.cid)
    let ref = parent.firstChild
    for (const node of wanted) {
      if (node !== ref) {
        if (node.parentNode === parent && holds(node)) {
          while (ref && ref !== node && !holds(ref)) { const next = ref.nextSibling; parent.appendChild(ref); ref = next }
          // Only two cards with viewers that swapped places get here.
          if (ref !== node) keepingViewState(viewers.get(node.dataset.cid), () => parent.insertBefore(node, ref))
        } else parent.insertBefore(node, ref)
      }
      if (node === ref) ref = node.nextSibling
    }
  }

  // The detail view's list. `groups` is [[title or null, containers]].
  function renderList(titleHtml, groups) {
    const el = $('content')
    if (!listUi || listUi.list.parentNode !== el) {
      el.textContent = ''
      listUi = { title: h('div', { className: 'section-title' }), list: h('div', { className: 'list' }), error: h('div'), cards: new Map(), groups: new Map() }
      el.append(listUi.title, listUi.list)
    }
    listUi.error.remove()
    setHtml(listUi.title, titleHtml)
    const ids = new Set(groups.flatMap(([, items]) => items.map((c) => c.id)))
    // A container that left the list takes its viewer with it.
    for (const v of [...viewers.values()]) if (!ids.has(v.id)) closeViewer(v)
    for (const [id, card] of listUi.cards) if (!ids.has(id)) { card.el.remove(); listUi.cards.delete(id) }
    for (const [name, node] of listUi.groups) if (!groups.some(([n]) => n === name)) { node.remove(); listUi.groups.delete(name) }
    const wanted = []
    for (const [name, items] of groups) {
      if (name) {
        if (!listUi.groups.has(name)) listUi.groups.set(name, h('div', { className: 'group-title', textContent: name }))
        wanted.push(listUi.groups.get(name))
      }
      for (const c of items) wanted.push(updateCard(c))
    }
    placeInOrder(listUi.list, wanted)
    applyStats()
  }

  // Replaces the list with a message: no card is left to hold a viewer.
  function showMessage(html) {
    closeAllLogs()
    $('content').innerHTML = html
  }

  // A failed poll says so above the list or tree while viewers are open, instead of destroying them.
  function showWorkerError(html) {
    const el = $('content')
    const ui = overviewMode() ? treeUi : listUi
    if (!viewers.size || !ui || ui.title.parentNode !== el) { showMessage(html); return }
    ui.error.innerHTML = html
    el.insertBefore(ui.error, ui.title)
  }

  // Message for a Docker/VM problem shared by both views; null when there is none.
  function dockerProblemHtml(err) {
    if (!err) return null
    const name = vm && vm.engine ? vm.engine.label : 'the engine'
    if (vm && vm.engine && vm.engine.missing) return `<div class="msg">Select another engine to see containers.</div>`
    if (vm && (vm.op || vm.starting)) {
      const waiting = { starting: `Waiting for ${name} to start…`, stopping: `Waiting for ${name} to stop…`, restarting: `Waiting for ${name} to restart…` }
      return `<div class="msg">${esc(waiting[vm.op || 'starting'])}</div>`
    }
    // The engine card already says it is stopped and offers Start; the raw socket error adds nothing.
    if (vm && !vm.running && vm.controls.start && vm.installed !== false) return `<div class="msg">Start ${esc(name)} to see containers.</div>`
    return `<div class="err"><b>Docker is unreachable.</b> Is ${esc(name)} running?<br><span class="sub">${esc(err)}</span></div>`
  }

  function renderViewBar() {
    const el = $('viewbar')
    const seg = (v, label) => `<button data-a="view" data-t="${v}" aria-pressed="${view === v}">${label}</button>`
    const html = pinned
      ? `<button data-a="back">&larr; All</button><span class="pinned-name">${esc(pinned.name)}</span>${pinned.sub ? `<span class="sub">${esc(pinned.sub)}</span>` : ''}`
      : `<div class="seg" role="group" aria-label="Container view">${seg('worktree', 'This worktree')}${seg('all', 'All')}</div>`
    if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html } // keeps focus across polls
  }

  const runningText = (n) => `${n.running}/${n.total} running`
  const stIcon = (state) => (state === 'running' ? '<span class="st running" title="running">&#9655;</span>'
    : ['exited', 'created', 'dead'].includes(state) ? `<span class="st stopped" title="${esc(state)}"><i class="sq"></i></span>`
      : `<span class="st other" title="${esc(state)}">&#9680;</span>`)
  const isOpen = (key) => !collapsed.has(key)

  // open = { kind, v, n, b } makes the element select a worktree / compose scope; cid also highlights a container.
  const openAttrs = (open, cid) => (open
    ? ` role="button" tabindex="0" data-open="${esc(open.kind)}" data-v="${esc(open.v)}" data-n="${esc(open.n)}" data-b="${esc(open.b || '')}"${cid ? ` data-cid="${esc(cid)}"` : ''}`
    : '')

  // Pure menu rules (no DOM). Each item: { id, label, disabled, danger } or { sep: true }.
  // <menu-rules>
  // g = { kind: 'worktree' | 'compose', running, total, projects (count), busy, conflict }
  // conflict: a Compose project of the group also has containers in another group, and `-p <project>` would hit them too.
  function groupMenuItems(g) {
    const none = g.total === 0
    const noStack = g.projects === 0 || Boolean(g.conflict)
    const reason = g.conflict ? 'Its Compose project also has containers outside this group' : undefined
    const items = [{ id: 'details', label: 'Open details' }, { sep: true }]
    items.push({ id: 'start', label: 'Start', reason, disabled: g.busy || none || noStack || g.running === g.total })
    items.push({ id: 'stop', label: 'Stop', reason, disabled: g.busy || none || noStack || g.running === 0 })
    items.push({ id: 'restart', label: 'Restart', reason, disabled: g.busy || none || noStack })
    if (g.kind === 'worktree') items.push({ id: 'up', label: 'Up', reason, disabled: g.busy || noStack })
    items.push({ id: 'down', label: 'Down', reason, danger: true, disabled: g.busy || none || noStack })
    return items
  }

  // c = { state, scopeKind: 'worktree' | 'compose' | 'container', busy }
  function containerMenuItems(c) {
    const live = ['running', 'paused', 'restarting'].includes(c.state)
    // Inspect actions (logs, shell) first, then lifecycle actions.
    const items = [{ id: 'logs', label: 'Logs' }]
    items.push({ id: 'shell', label: 'Shell', disabled: c.busy || c.state !== 'running' })
    items.push({ sep: true })
    items.push(live ? { id: 'stop', label: 'Stop', disabled: c.busy } : { id: 'start', label: 'Start', disabled: c.busy })
    items.push({ id: 'restart', label: 'Restart', disabled: c.busy })
    return items
  }
  // </menu-rules>

  // Everything the menu can target, keyed by a stable id: groups `g:w:<path>` / `g:c:<workdir>`, containers `k:<id>`.
  function buildCtxIndex(o) {
    const idx = new Map()
    if (!o) return idx
    const owners = new Map() // compose project -> number of groups holding its containers
    const countProjects = (g) => { for (const p of new Set(g.containers.map((c) => c.project).filter(Boolean))) owners.set(p, (owners.get(p) || 0) + 1) }
    for (const p of o.projects) for (const w of p.worktrees) countProjects(w)
    for (const g of o.other.projects) countProjects(g)
    const group = (kind, v, name, sub, g) => {
      const key = `g:${kind === 'worktree' ? 'w' : 'c'}:${v}`
      const scope = kind === 'worktree' ? { kind: 'worktree', path: v } : { kind: 'compose', workdir: v }
      const projects = [...new Set(g.containers.map((c) => c.project).filter(Boolean))]
      idx.set(key, { type: 'group', key, kind, v, name, sub, scope, label: name, projects, conflict: projects.some((p) => owners.get(p) > 1), running: g.running, total: g.total })
      for (const c of g.containers) idx.set(`k:${c.id}`, { type: 'container', key: `k:${c.id}`, scopeKind: kind, scope, v, name, sub, c, label: c.name })
      return key
    }
    for (const p of o.projects) for (const w of p.worktrees) group('worktree', w.path, w.name, w.branch, w)
    for (const g of o.other.projects) if (g.workdir) group('compose', g.workdir, g.name, 'Compose project', g)
    for (const c of o.individual.containers) {
      idx.set(`k:${c.id}`, { type: 'container', key: `k:${c.id}`, scopeKind: 'container', scope: { kind: 'container', id: c.id }, v: c.id, name: c.name, sub: 'Container', c, label: c.name })
    }
    return idx
  }

  const resolveCtx = (key) => buildCtxIndex(overview).get(key) || null

  function menuItemsFor(t) {
    if (t.type === 'group') return groupMenuItems({ kind: t.kind, running: t.running, total: t.total, projects: t.projects.length, busy: groupOps.has(t.key), conflict: t.conflict })
    return containerMenuItems({ state: t.c.state, scopeKind: t.scopeKind, busy: rowOps.has(t.c.id) })
  }

  const moreBtn = (ctx, label) => `<button type="button" class="more" data-more="${esc(ctx)}" aria-haspopup="menu" aria-expanded="${Boolean(menu && menu.key === ctx)}" aria-label="Actions for ${esc(label)}">&#8943;</button>`
  const opHtml = (op) => (op ? `<span class="op"><span class="spin"></span> ${esc(op.label)}</span>` : '')

  // What is wrong inside a collapsed group. `health: starting` and exit 137 are not problems.
  const PROBLEMS = [
    { cls: 'bad', text: 'unhealthy', title: 'Healthcheck failing', is: (m) => m.kind === 'unhealthy' },
    { cls: 'warn', text: 'restarting', title: 'Being restarted by the engine', is: (m) => m.kind === 'restarting' },
    { cls: 'bad', text: 'exited', title: 'Stopped with an abnormal exit code', is: (m) => m.kind === 'exit' && m.code !== 137 }
  ]
  const containersOf = (group) => group.containers || (group.worktrees || group.projects).flatMap(containersOf)
  function problemSummary(group) {
    const markers = containersOf(group).map((c) => c.marker).filter(Boolean)
    const flags = PROBLEMS.map((p) => {
      const n = markers.filter(p.is).length
      return n ? `<span class="flag ${p.cls}" title="${p.title}">${n} ${p.text}</span>` : ''
    }).join('')
    return flags ? `<span class="tg-flags">${flags}</span>` : ''
  }

  function treeHead(key, depth, name, sub, counts, open, ctx) {
    const chev = `<span class="chev"${open ? ` data-toggle="${esc(key)}"` : ''}>${isOpen(key) ? '&#9662;' : '&#9656;'}</span>`
    const attrs = (open ? openAttrs(open) : ` role="button" tabindex="0" data-toggle="${esc(key)}" aria-expanded="${isOpen(key)}"`) + (ctx ? ` data-ctx="${esc(ctx)}"` : '')
    const problems = isOpen(key) ? '' : problemSummary(counts)
    return `<div class="tg-head${open ? ' openable' : ''}${problems ? ' flagged' : ''}" style="--d:${depth}"${attrs}>${chev}<span class="tg-name">${esc(name)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}${problems}${ctx ? opHtml(groupOps.get(ctx)) : ''}<span class="count">${esc(runningText(counts))}</span>${ctx ? moreBtn(ctx, name) : ''}</div>`
  }

  // ctx = true when the container can be acted on: context menu, logs and shell buttons. Rows that are not
  // openable then still need a tab stop. The logs button's pressed state is set on the node (markLogButton),
  // so opening a viewer does not rewrite the row.
  function treeRow(c, depth, open, ctx) {
    const ck = `k:${c.id}`
    const focusable = ctx && !open ? ' tabindex="0"' : ''
    const act = (a, label, more = '') => `<button type="button" data-row="${a}" data-t="${esc(c.id)}" aria-label="${label} ${esc(c.name)}"${more}>${a}</button>`
    const shell = c.state === 'running' ? act('shell', 'Shell in', rowOps.has(c.id) ? ' aria-disabled="true"' : '') : ''
    const status = `<div class="sub">${esc(c.status)}</div>`
    return `<div class="crow${open ? ' openable' : ''}" style="--d:${depth}"${openAttrs(open, open ? c.id : null)}${focusable}${ctx ? ` data-ctx="${esc(ck)}"` : ''}>
        <div class="crow-main">${stIcon(c.state)}<span class="name">${esc(c.name)}</span>${markerHtml(c.marker)}<span class="img">${esc(c.image)}</span>${opHtml(rowOps.get(c.id))}${ctx ? moreBtn(ck, c.name) : ''}</div>
        ${ctx ? `<div class="crow-foot">${status}<span class="crow-acts">${act('logs', 'Logs of')}${shell}</span></div>` : status}
        ${renderPorts(c.ports)}
      </div>`
  }

  // The visible tree as a flat list: { key, html } per header, plus `container` per container row.
  function treeNodes(o) {
    const out = []
    const head = (key, ...args) => out.push({ key: `h:${key}`, html: treeHead(key, ...args) })
    const row = (c, depth, open, ctx) => out.push({ key: `r:${c.id}`, html: treeRow(c, depth, open, ctx), container: c })
    for (const p of o.projects) {
      head(`p:${p.id}`, 0, p.name, '', p)
      if (!isOpen(`p:${p.id}`)) continue
      for (const w of p.worktrees) {
        const open = { kind: 'worktree', v: w.path, n: w.name, b: w.branch }
        head(`w:${w.path}`, 1, w.name, w.branch, w, open, `g:w:${w.path}`)
        if (isOpen(`w:${w.path}`)) for (const c of w.containers) row(c, 2, open, true)
      }
    }
    if (o.other.projects.length) {
      head('other', 0, 'Other Compose projects', '', o.other)
      if (isOpen('other')) for (const g of o.other.projects) {
        const open = g.workdir ? { kind: 'compose', v: g.workdir, n: g.name, b: 'Compose project' } : null
        const key = `o:${encodeURIComponent(g.key)}`
        if (open) head(key, 1, g.name, '', g, open, `g:c:${g.workdir}`)
        else head(key, 1, g.name, '', g)
        if (isOpen(key)) for (const c of g.containers) row(c, 2, open, Boolean(open))
      }
    }
    if (o.individual.containers.length) {
      head('individual', 0, 'Individual containers', '', o.individual)
      if (isOpen('individual')) for (const c of o.individual.containers) row(c, 1, null, true)
    }
    return out
  }

  const renderTree = (o) => treeNodes(o).map((n) => n.html).join('')

  // Brings the tree's nodes up to date in place, like renderList: a node holding a viewer is never moved or
  // rebuilt, and a viewer whose row is no longer shown (gone, or inside a collapsed group) is closed.
  function updateTree(o) {
    const wanted = treeNodes(o)
    const keys = new Set(wanted.map((n) => n.key))
    const targets = buildCtxIndex(o) // the scopes the context menu uses
    const scopeOf = (id) => { const t = targets.get(`k:${id}`); return t ? t.scope : null }
    for (const v of [...viewers.values()]) if (!keys.has(`r:${v.id}`) || !scopeOf(v.id)) closeViewer(v)
    for (const [key, node] of treeUi.nodes) if (!keys.has(key)) { node.el.remove(); treeUi.nodes.delete(key) }
    const els = wanted.map(({ key, html, container: c }) => {
      let node = treeUi.nodes.get(key)
      if (!node) {
        const body = h('div', { className: 'tnode-body' })
        node = { body, el: c ? h('div', { className: 'titem', data: { cid: c.id, key } }, body) : h('div', { data: { key } }, body) }
        treeUi.nodes.set(key, node)
      }
      const rewritten = node.body.renderedHtml !== html
      setHtml(node.body, html)
      if (!c) return node.el
      node.name = c.name
      node.scope = scopeOf(c.id)
      const v = viewers.get(c.id)
      if (v) {
        if (v.name !== c.name) setViewerName(v, c.name)
        // Without the worktree list the grouping is a fallback: keep the scope the viewer was opened with.
        if (!o.orcaError) v.scope = node.scope
      }
      if (rewritten) markLogButton(c.id)
      return node.el
    })
    placeInOrder(treeUi.tree, els)
  }

  function renderOverview() {
    const el = $('content')
    pruneStaleOps()
    if (!overview) { showMessage('<div class="msg"><span class="spin"></span> Loading containers…</div>'); return }
    const problem = dockerProblemHtml(overview.error)
    if (problem) { showMessage(problem); closeMenu(false); return }
    const n = overview.projects.reduce((a, p) => a + p.total, 0) + overview.other.total + overview.individual.total
    const running = overview.projects.reduce((a, p) => a + p.running, 0) + overview.other.running + overview.individual.running
    const title = `<div class="section-title">Containers <span class="count">${running}/${n} running</span></div>`
    const warn = overview.orcaError ? `<div class="msg">${esc(overview.orcaError)} Worktree grouping is unavailable.</div>` : ''
    if (n === 0) { showMessage(`${title}${warn}<div class="msg">No containers.</div>`); syncMenu(); return }
    // Focus on a header, row or one of their controls survives a rewrite; a viewer's own focus is never touched.
    const active = document.activeElement
    const holder = active && el.contains(active) && active.closest && !active.closest('.logv') ? active.closest('[data-key]') : null
    // `held` names the focused control inside the header or row; none when that element itself has the focus.
    const held = holder && active !== holder.firstElementChild.firstElementChild
      ? ['row', 'copy', 'more', 'toggle'].find((k) => active.dataset[k] !== undefined)
      : undefined
    const heldKey = holder && holder.dataset.key
    const heldValue = held && active.dataset[held]
    if (!treeUi || treeUi.tree.parentNode !== el) {
      el.textContent = ''
      treeUi = { title: h('div'), warn: h('div'), tree: h('div', { className: 'tree' }), error: h('div'), nodes: new Map() }
      el.append(treeUi.title, treeUi.warn, treeUi.tree)
    }
    treeUi.error.remove()
    setHtml(treeUi.title, title)
    setHtml(treeUi.warn, warn)
    updateTree(overview)
    if (holder && !menu && document.activeElement !== active) {
      const node = treeUi.nodes.get(heldKey)
      const target = node && (held
        ? Array.from(node.body.querySelectorAll(`[data-${held}]`)).find((x) => x.dataset[held] === heldValue)
        : node.body.firstElementChild)
      if (target) target.focus({ preventScroll: true })
    }
    syncMenu()
  }

  // Scrolls to and briefly highlights the container the user clicked in the overview (once per pin).
  function applyFocus() {
    if (!pinned || pinned.focusDone || !state || searching) return
    pinned.focusDone = true
    const el = pinned.focusId ? Array.from(document.querySelectorAll('.item[data-cid]')).find((x) => x.dataset.cid === pinned.focusId) : null
    if (el) {
      el.scrollIntoView({ block: 'center' })
      el.classList.add('flash')
    }
  }

  function render() {
    renderVm()
    renderCompose()
    renderViewBar()
    const el = $('content')
    if (menu && !overviewMode()) closeMenu(false)
    if (overviewMode()) { renderOverview(); return }
    if (searching || !state) {
      // After a failed poll the open viewers stay until there is an answer again.
      if (!searching && viewers.size) return
      showMessage(`<div class="msg"><span class="spin"></span> ${pinned ? 'Loading containers…' : 'Looking for containers in this worktree…'}</div>`)
      return
    }
    const problem = dockerProblemHtml(state.error)
    if (problem) { showMessage(problem); return }
    if (!state.worktree) {
      if (pinned) { showMessage(`<div class="msg">${esc(state.worktreeError || 'Could not load this scope.')}</div>`); return }
      // Without a terminal Orca only tells us branch + name, which several worktrees can share.
      showMessage(`<div class="msg"><b>Open a terminal in this workspace to load its Docker containers.</b>${state.worktreeError ? `<div class="sub">${esc(state.worktreeError.replace(/\s*Open a terminal in the one you want\.\s*$/, ''))}</div>` : ''}</div>`)
      return
    }
    const cs = state.containers
    const running = cs.filter((c) => c.state === 'running').length
    const title = `Containers <span class="count">${running}/${cs.length} running</span>`
    if (cs.length === 0) { showMessage(`<div class="section-title">${title}</div><div class="msg">No containers for this ${pinned && pinned.scope.kind === 'compose' ? 'Compose project' : pinned && pinned.scope.kind === 'container' ? 'container' : 'worktree'}.</div>`); return }
    const groups = {}
    for (const c of cs) (groups[c.service ? 'Compose services' : 'Standalone'] ||= []).push(c)
    // Group headers only help when both kinds are present.
    const many = Object.keys(groups).length > 1
    renderList(title, Object.entries(groups).map(([g, items]) => [many ? g : null, items]))
    applyFocus()
  }

  // Identifies the focused workspace, so a switch is noticed before the worker answers.
  async function contextKey() {
    try { return JSON.stringify(await window.orca.host.call('workspace.readContext', {})) } catch { return null }
  }

  // Whether two keys are the same workspace although its terminals changed. Worktrees sharing branch and name
  // differ in their terminals. With none on one side the worker's answer decides (see `shownWorktree`).
  function sameWorkspace(from, to) {
    if (from === to) return true
    try {
      const [a, b] = [JSON.parse(from), JSON.parse(to)]
      if (!a || !b || a.branch !== b.branch || a.displayName !== b.displayName) return false
      const before = (a.terminals || []).map((t) => t.id)
      const after = new Set((b.terminals || []).map((t) => t.id))
      return !before.length || !after.size || before.some((id) => after.has(id))
    } catch { return false } // no key yet, or a pinned scope
  }

  // What the detail view is showing: the pinned scope, or the focused workspace.
  const currentKey = async () => (pinned ? `pin:${JSON.stringify(pinned.scope)}` : contextKey())

  // Cheap check between polls: on a workspace switch, show "looking" and fetch right away.
  // Only the "This worktree" view follows the workspace.
  async function watchContext() {
    if (!followsWorkspace()) return
    const key = await contextKey()
    if (key === shownKey || !followsWorkspace()) return
    if (!searching && !sameWorkspace(shownKey, key)) { searching = true; resetForWorkspaceSwitch(); render() }
    refresh()
  }

  // "All" view: one overview call (+ the VM); no stats.
  // True when a poll answer must be dropped: it is stale, or its parts belong to different engines. The engine
  // reported by the VM call becomes the panel's engine (it also picks up a change made from elsewhere).
  function adoptEngine(nextVm, other) {
    if (nextVm.stale || other.stale) { engineName = null; return true }
    const name = nextVm.engine && nextVm.engine.name
    if (other.engineName !== undefined && other.engineName !== name) { engineName = null; return true }
    if (name !== undefined) {
      engineName = name
      if (logsEngine !== null && name !== logsEngine) closeAllLogs() // changed from elsewhere
      logsEngine = name
    }
    if (others && name !== undefined && others.engineName !== name) { others = null; pollOthers() }
    return false
  }

  // Asks for the engine status and shows its outcome as soon as there is one, whatever the other requests do.
  function requestVm(seq) {
    const ask = ++vmAsked
    const answer = request('colima.vm', {})
    const newest = () => seq === modeSeq && ask > vmShown
    answer.then((next) => {
      if (!newest() || next.stale || !next.engine) return
      vmShown = ask
      if (vm && vm.engine.name !== next.engine.name) engineCounts = null
      vm = next
      engineProblem = null
      const selected = next.engine.missing ? [] : [{ name: next.engine.name, label: next.engine.label, state: null }]
      engineList = [...selected, ...(next.engines || [])]
      renderVm()
    }).catch((err) => {
      if (!newest()) return
      vmShown = ask
      vm = null // a status that can no longer be read is not shown as current
      engineProblem = err.message
      renderVm()
    })
    return answer
  }

  async function refreshOverview(seq) {
    const [nextOverview, nextVm] = await Promise.all([request('colima.overview', {}), requestVm(seq)])
    if (seq !== modeSeq) return
    if (adoptEngine(nextVm, nextOverview)) return
    engineCounts = nextOverview.engineCounts || null
    overview = nextOverview
    // The VM is going down: nothing to follow or search any more.
    if (vm && (vm.op === 'stopping' || vm.op === 'restarting')) closeAllLogs()
    render()
  }

  async function refresh() {
    if (busy || switching) return
    busy = true
    const seq = modeSeq
    let key = null
    try {
      if (overviewMode()) { await refreshOverview(seq); return }
      key = await currentKey()
      if (!searching && !sameWorkspace(shownKey, key)) { searching = true; resetForWorkspaceSwitch(); render() }
      const [nextState, nextVm] = await Promise.all([request('colima.state', {}), requestVm(seq)])
      if (seq !== modeSeq) return
      if (adoptEngine(nextVm, nextState)) return
      engineCounts = nextState.engineCounts || null
      // The VM is going down: nothing to follow or search any more.
      if (vm && (vm.op === 'stopping' || vm.op === 'restarting')) closeAllLogs()
      // The pinned worktree / project disappeared: go back to the overview.
      if (nextState.gone) { leavePinned(nextState.message); return }
      // The workspace changed while the worker was answering: this result is stale.
      if (key !== await currentKey() || seq !== modeSeq) { renderVm(); return }
      if (nextState.worktree !== shownWorktree) closeAllLogs() // another worktree behind a similar key
      shownWorktree = nextState.worktree
      state = nextState
      shownKey = key
      searching = false
      render() // also closes the viewers of containers that are gone
      if (statsKey !== shownKey) pollStats()
    } catch (err) {
      if (seq !== modeSeq) return
      state = null
      // This context has had its answer: the watcher waits for a change, and the 3s poll retries.
      shownKey = key
      renderVm()
      renderCompose()
      showWorkerError(`<div class="err">Worker error: ${esc(err.message)}</div>`)
    } finally {
      if (seq === modeSeq) {
        busy = false
        if (searching && followsWorkspace()) setTimeout(watchContext, 0)
      }
    }
  }

  // ---- View switching ----
  function resetDetail() {
    closeMenu(false)
    modeSeq++
    state = null
    shownKey = null
    searching = true
    resetForWorkspaceSwitch()
    busy = false
  }

  function setView(next) {
    if (next === view && !pinned) return
    view = next
    pinned = null
    resetDetail()
    request('colima.view', { view: next }).catch(() => {})
    render()
    refresh()
  }

  function openScope(d) {
    const scope = d.open === 'worktree' ? { kind: 'worktree', path: d.v } : d.open === 'container' ? { kind: 'container', id: d.v } : { kind: 'compose', workdir: d.v }
    pinned = { scope, name: d.n, sub: d.b, focusId: d.cid || null, focusDone: false }
    resetDetail()
    render()
    refresh()
  }

  function leavePinned(message) {
    pinned = null
    resetDetail()
    if (message) setStatus(message, 6000)
    render()
    refresh()
  }

  function toggleGroup(key) {
    if (collapsed.has(key)) collapsed.delete(key)
    else collapsed.add(key)
    render()
  }

  const LOGS_END_LABELS = { exited: 'Stopped (container exited)', idle: 'Stopped (panel was idle)', 'not-owned': 'Stopped (container left this worktree)', limit: 'Stopped (too many live logs)', error: 'Stopped (docker error)' }

  function resetForWorkspaceSwitch() {
    stats = {}
    statsKey = null
    closeAllLogs()
  }

  const isOpenViewer = (v) => viewers.get(v.id) === v // false once closed, also if the container was opened again
  const viewerOf = (el) => {
    const root = el.closest && el.closest('.logv')
    return root ? viewers.get(root.dataset.logs) : undefined
  }

  // A viewer's nodes are created once. `data-lv` names the controls.
  function createViewer(id) {
    const button = (lv, textContent, more = {}) => h('button', { type: 'button', textContent, ...more, data: { lv } })
    const els = {
      title: h('h2', { className: 'logv-title' }),
      state: h('span', { className: 'logv-state' }),
      mode: button('mode', 'History'),
      expand: button('expand', 'Expand'),
      terminal: button('terminal', 'Open in terminal', { title: 'Open these logs in a new Orca terminal' }),
      close: button('close', 'close'),
      note: h('div', { className: 'logv-note', hidden: true, attrs: { role: 'status' } }),
      q: h('input', { className: 'logv-q', type: 'text', maxLength: 200, placeholder: 'Search full history', autocomplete: 'off', spellcheck: false, data: { lv: 'q' }, attrs: { 'aria-label': 'Search full history' } }),
      case: button('case', 'Aa', { title: 'Match case', attrs: { 'aria-pressed': 'false' } }),
      prev: button('prev', '↑', { title: 'Previous match (Shift+Enter)', disabled: true }),
      next: button('next', '↓', { title: 'Next match (Enter)', disabled: true }),
      count: h('span', { className: 'logv-count' }),
      older: h('div', { className: 'logv-older' }),
      lines: h('div', { className: 'logv-lines' }),
      results: h('div', { className: 'logv-results', hidden: true }),
      context: h('div', { className: 'logv-context', hidden: true }),
      resize: h('div', { className: 'logv-resize', tabIndex: 0, title: 'Drag, or use the up and down arrows. Enter or double-click: automatic height', data: { lv: 'resize' },
        attrs: { role: 'separator', 'aria-orientation': 'horizontal', 'aria-label': 'Log height', 'aria-valuemin': '120', 'aria-valuemax': '4000' } })
    }
    els.search = h('div', { className: 'logv-search', hidden: true }, els.q, els.case, els.prev, els.next, els.count)
    els.box = h('pre', { className: 'logv-box' }, els.older, els.lines, els.results, els.context)
    const head = h('div', { className: 'logv-head' }, els.title, els.state, els.mode, els.expand, els.terminal, els.close)
    return {
      id,
      name: id,
      scope: null, // the row's scope in the All view; in the detail view request() adds the pinned one
      els,
      el: h('div', { className: 'logv', data: { logs: id } }, head, els.note, els.search, els.box, els.resize),
      live: false, // a follower is running
      mode: 'live', // 'live' (follower) or 'history' (paging + search)
      view: 'tail', // history mode only: 'tail' | 'results' | 'context'
      epoch: 0, // bumped on every mode switch / close: stale async results are dropped
      searchSeq: 0,
      searchTimer: null,
      searchCase: false,
      searchDone: null, // { query, caseSensitive } of the results on screen
      lastResult: null,
      hits: [], // result line elements
      hitIdx: -1,
      resultsScroll: 0,
      partial: '', // trailing text of the stream that has no newline yet
      olderDone: false, // the start of the logs was reached
      olderBusy: false,
      olderEls: null,
      olderKey: null,
      expandScroll: null, // { before, after }: log position around expanding, to undo what the taller box clamped
      reveal: true, // scroll to it once more if its first content arrives promptly
      revealY: 0 // page position after opening: a different one means the user scrolled
    }
  }

  function setViewerName(v, name) {
    v.name = name
    v.els.title.textContent = `Logs: ${name}`
  }

  const revealViewer = (v) => v.el.scrollIntoView({ block: 'nearest' })
  function revealContent(v) {
    if (!v.reveal) return
    v.reveal = false
    if ((window.scrollY || 0) === v.revealY) revealViewer(v)
  }

  function setLogsState(v, live, text) {
    v.live = live
    const badge = v.els.state
    if (v.mode === 'history') badge.textContent = 'History'
    else if (live) badge.innerHTML = '<span class="live">&#9679; Live</span>'
    else badge.textContent = text || ''
  }

  function resetLogView(v) {
    v.partial = ''
    v.olderDone = false
    v.olderBusy = false
    v.els.lines.textContent = ''
    v.els.results.textContent = ''
    v.els.context.textContent = ''
    v.hits = []
    v.hitIdx = -1
    v.searchDone = null
    v.lastResult = null
    v.searchSeq++
    clearTimeout(v.searchTimer)
    v.els.q.value = ''
    v.els.count.textContent = ''
    updateNav(v)
    setLogsView(v, 'tail')
    updateOlderBar(v)
  }

  function setLogsView(v, view) {
    v.view = view
    v.expandScroll = null
    v.els.older.hidden = view !== 'tail'
    v.els.lines.hidden = view !== 'tail'
    v.els.results.hidden = view !== 'results'
    v.els.context.hidden = view !== 'context'
  }

  function updateModeUi(v) {
    const history = v.mode === 'history'
    v.els.mode.textContent = history ? 'Live' : 'History'
    v.els.search.hidden = !history
  }

  async function toggleLogs(id) {
    const v = viewers.get(id)
    if (v) { closeViewer(v); return }
    setStatus('') // the log viewer is its own progress indicator
    await openLogs(id)
  }

  // What every request about one viewer carries.
  const viewerInput = (v, more) => ({ id: v.id, ...(v.scope && { scope: v.scope }), ...more })

  // Opens a viewer inside the container's card or row, closing the oldest one when there are too many.
  async function openLogs(id) {
    const open = viewers.get(id)
    if (open) { revealViewer(open); return }
    const card = cardOf(id)
    if (!card) return
    let evicted = null
    if (viewers.size >= MAX_VIEWERS) {
      evicted = viewers.values().next().value
      closeViewer(evicted)
    }
    const v = createViewer(id)
    setViewerName(v, card.name)
    v.scope = card.scope || null
    viewers.set(id, v)
    card.el.appendChild(v.el)
    applyLogsHeight(v)
    markLogButton(id)
    if (evicted) {
      v.els.note.textContent = `Closed the logs of ${evicted.name}: at most ${MAX_VIEWERS} can be open.`
      v.els.note.hidden = false
      setTimeout(() => { v.els.note.hidden = true }, NOTE_MS)
    }
    const started = startLive(v)
    revealViewer(v)
    v.revealY = window.scrollY || 0
    setTimeout(() => { v.reveal = false }, REVEAL_MS)
    await started
  }

  async function startLive(v) {
    const epoch = ++v.epoch
    v.mode = 'live'
    resetLogView(v)
    updateModeUi(v)
    setLogsState(v, true)
    try {
      const r = await request('colima.logs.follow', viewerInput(v))
      if (!isOpenViewer(v) || epoch !== v.epoch) return // closed or switched while the worker was answering
      if (!r.ok) { setStatus(r.message); closeViewer(v) }
    } catch (err) {
      if (isOpenViewer(v) && epoch === v.epoch) { setStatus(`logs failed: ${err.message}`); closeViewer(v) }
    }
  }

  const stopWorkerLogs = (input) => request('colima.logs.stop', input).catch(() => {})

  async function startHistory(v) {
    const epoch = ++v.epoch
    v.mode = 'history'
    stopWorkerLogs(viewerInput(v)) // follower (and any search) off
    resetLogView(v)
    updateModeUi(v)
    setLogsState(v, false)
    // Last page of history: everything older than "now" (plus a margin for clock skew).
    await loadOlder(v, new Date(Date.now() + 5000).toISOString())
    if (isOpenViewer(v) && epoch === v.epoch) v.els.q.focus()
  }

  // Removes a viewer from the panel; the caller tells the worker.
  function dropViewer(v) {
    setExpanded(v, false)
    if (logsDrag && logsDrag.viewer === v) logsDrag = null
    v.epoch++
    v.searchSeq++
    clearTimeout(v.searchTimer)
    viewers.delete(v.id)
    v.el.remove()
    markLogButton(v.id)
  }

  function closeViewer(v) {
    if (!isOpenViewer(v)) return
    dropViewer(v)
    stopWorkerLogs(viewerInput(v))
  }

  function closeAllLogs() {
    if (!viewers.size) return
    for (const v of [...viewers.values()]) dropViewer(v) // every way out of a view or engine passes here
    stopWorkerLogs({})
  }

  // ---- Log viewer size and terminal ----
  const logAtBottom = (pre) => pre.scrollHeight - pre.scrollTop - pre.clientHeight < 24

  function applyLogsHeight(v) {
    const style = v.els.box.style
    const fixed = expandedViewer !== v && logsHeight !== null
    style.height = fixed ? `${logsHeight}px` : ''
    style.maxHeight = fixed ? 'none' : ''
    announceLogsHeight(v)
  }

  function announceLogsHeight(v) {
    v.els.resize.setAttribute('aria-valuenow', logsHeight ?? v.els.box.offsetHeight)
  }

  // One height for every viewer; each keeps following the tail, or else the same position.
  function setLogsHeight(height) {
    logsHeight = height === null ? null : Math.round(Math.max(LOGS_HEIGHT_MIN, Math.min(LOGS_HEIGHT_MAX, height)))
    for (const v of viewers.values()) {
      const pre = v.els.box
      const follow = logAtBottom(pre)
      const top = pre.scrollTop
      applyLogsHeight(v)
      pre.scrollTop = follow ? pre.scrollHeight : top
    }
  }

  function saveLogsHeight() {
    logsHeightChosen = true
    clearTimeout(logsHeightTimer)
    logsHeightTimer = setTimeout(() => { request('colima.logs.height', { height: logsHeight }).catch(() => {}) }, LOGS_HEIGHT_SAVE_MS)
  }

  async function loadLogsHeight() {
    try {
      const r = await request('colima.logs.height', {})
      if (!logsHeightChosen && r && Number.isInteger(r.height)) setLogsHeight(r.height)
    } catch { /* automatic height */ }
  }

  function setExpanded(v, on) {
    if (on === (expandedViewer === v)) return
    if (on && expandedViewer) setExpanded(expandedViewer, false)
    const pre = v.els.box
    const follow = logAtBottom(pre)
    const top = pre.scrollTop
    // Not scrolled while expanded: go back to where the user was, even if the taller box clamped it.
    const restore = !on && v.expandScroll && top === v.expandScroll.after ? v.expandScroll.before : null
    if (on) pageScroll = window.scrollY || 0
    expandedViewer = on ? v : null
    document.body.classList.toggle('logs-max', on)
    v.el.classList.toggle('max', on)
    v.els.expand.textContent = on ? 'Collapse' : 'Expand'
    applyLogsHeight(v)
    pre.scrollTop = restore ?? (follow ? pre.scrollHeight : top)
    v.expandScroll = on && !follow ? { before: top, after: pre.scrollTop } : null
    if (!on && window.scrollTo) window.scrollTo(0, pageScroll)
  }

  // The user's own toggle: focus stays on the button.
  function toggleExpanded(v) {
    setExpanded(v, expandedViewer !== v)
    v.els.expand.focus({ preventScroll: true })
  }

  async function openLogsTerminal(v) {
    const button = v.els.terminal
    button.disabled = true
    setStatus('Opening terminal…')
    try {
      const r = await request('colima.logs.terminal', viewerInput(v))
      if (r.ok) setStatus('Logs opened in a new terminal', 3000)
      else setStatus(r.message ? `Open in terminal failed: ${r.message}` : '', 10000)
    } catch (err) { setStatus(`Open in terminal failed: ${err.message}`, 10000) }
    button.disabled = false
  }

  const resizerOf = (e) => (e.target.dataset && e.target.dataset.lv === 'resize' ? viewerOf(e.target) : undefined)

  document.addEventListener('keydown', (e) => {
    const v = resizerOf(e)
    if (!v) return
    const now = logsHeight ?? v.els.box.offsetHeight
    const next = { ArrowUp: now - LOGS_HEIGHT_STEP, ArrowDown: now + LOGS_HEIGHT_STEP, Home: LOGS_HEIGHT_MIN, Enter: null }[e.key]
    if (next === undefined) return
    e.preventDefault()
    setLogsHeight(next)
    saveLogsHeight()
  })
  document.addEventListener('focusin', (e) => { const v = resizerOf(e); if (v) announceLogsHeight(v) })
  document.addEventListener('dblclick', (e) => { if (resizerOf(e)) { setLogsHeight(null); saveLogsHeight() } })

  document.addEventListener('pointerdown', (e) => {
    const v = resizerOf(e)
    if (!v || e.button !== 0) return
    e.preventDefault() // no text selection while dragging
    e.target.focus({ preventScroll: true })
    if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId)
    logsDrag = { viewer: v, y: e.clientY, height: v.els.box.offsetHeight, moved: false }
  })
  const endLogsDrag = () => {
    if (!logsDrag) return
    const { moved } = logsDrag
    logsDrag = null
    if (moved) saveLogsHeight() // a plain click keeps the automatic height
  }
  document.addEventListener('pointermove', (e) => {
    if (!logsDrag) return
    if (!e.buttons) { endLogsDrag(); return } // released where no event reached us
    if (e.clientY === logsDrag.y && !logsDrag.moved) return
    logsDrag.moved = true
    logsHeightChosen = true
    setLogsHeight(logsDrag.height + e.clientY - logsDrag.y)
    // A log growing past the bottom edge would grow out of sight: the page follows the bar.
    logsDrag.viewer.els.resize.scrollIntoView({ block: 'nearest' })
  })
